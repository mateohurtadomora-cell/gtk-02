<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GTK – Global Technology Knowledge Corp.</title>
<meta http-equiv="refresh" content="0; url=./en/">
<link rel="canonical" href="./en/">
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#F5F5F7;color:#1D1D1F}
  @media (prefers-color-scheme:dark){body{background:#0B0B0D;color:#F5F5F7}}
  .box{text-align:center;padding:32px}
  a{color:#0064D2;font-weight:600;text-decoration:none;margin:0 10px}
  p{color:#86868B}
</style>
</head>
<body>
<div class="box">
  <p>Redirecting… / Redirigiendo…</p>
  <p><a href="./es/">Español</a> · <a href="./en/">English</a></p>
</div>
<script>
  if(navigator.language && navigator.language.slice(0,2).toLowerCase() === 'es'){
    window.location.replace('./es/');
  } else {
    window.location.replace('./en/');
  }
</script>
</body>
</html>
